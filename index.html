<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AK Learning Point</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwRDQuXVyKGKfCI-kifRPb-vzb8Uv2AIv7YzMSihcP5iKPlR9BJj-DVSSDp8q_VWTij/exec" 
    allow="clipboard-write; camera; microphone; fullscreen">
  </iframe>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var rawQId = params.get('quizId') || params.get('quiz_id');
    if (rawQId) {
      // Agar WhatsApp link me extra space ya text jud jaye toh sirf pehla word (Quiz ID) uthao
      var cleanQId = decodeURIComponent(rawQId).trim().split(/[\s\?&#]/)[0];
      var frame = document.querySelector('iframe');
      if (frame && cleanQId) {
        var currentSrc = frame.getAttribute('src').split('?')[0];
        frame.src = currentSrc + "?quizId=" + encodeURIComponent(cleanQId);
      }
    }
  })();
</script>

</body>
</html>
